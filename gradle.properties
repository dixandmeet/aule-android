org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 propose un nouveau DSL et un Kotlin intégré. On reste sur le DSL
# classique et le Kotlin Gradle Plugin : c'est la combinaison éprouvée sur cette
# machine (SAE/android tourne dessus), et le nouveau DSL n'apporte rien qui
# justifie d'essuyer ses plâtres sur la fondation du projet.
android.newDsl=false
android.builtInKotlin=false

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
